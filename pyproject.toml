[project]
name = "aump-examples"
version = "0.1.0"
description = "Reference AUMP agentic marketplace examples"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Agentic User Mandate Protocol Authors" }
]
dependencies = [
  "aump",
  "aump-conformance"
]

[project.scripts]
aump-examples = "aump_examples.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.14.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aump_examples"]

[tool.uv.sources]
aump = { path = "../aump-py", editable = true }
aump-conformance = { path = "../conformance", editable = true }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
