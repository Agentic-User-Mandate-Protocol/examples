[project]
name = "aump-examples"
version = "0.1.0"
description = "Reference AUMP agentic marketplace examples"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["agents", "ai", "mandates", "protocol", "examples"]
authors = [
  { name = "Agentic User Mandate Protocol Authors" }
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Testing"
]
dependencies = [
  "aump",
  "aump-conformance"
]

[project.urls]
Homepage = "https://usermandateprotocol.com/"
Documentation = "https://usermandateprotocol.com/examples/marketplace/"
Repository = "https://github.com/Agentic-User-Mandate-Protocol/examples"
Issues = "https://github.com/Agentic-User-Mandate-Protocol/examples/issues"

[project.scripts]
aump-examples = "aump_examples.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.14.0",
  "twine>=6.0.0"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aump_examples"]

[tool.hatch.build.targets.wheel.force-include]
"data" = "aump_examples/data"

[tool.uv.sources]
aump = { path = "../aump-py", editable = true }
aump-conformance = { path = "../conformance", editable = true }

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
